name: Daily OKOPF Update

on:
  schedule:
    - cron: '0 16 * * *'      # 16:00 UTC = 19:00 МСК
  workflow_dispatch:

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_OKOPF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI поддерживает API-токены")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/okopf-classifier-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -30

      - name: Detect SRC and copy web files (FILES_OK gate)
        id: copy
        run: |
          # Авто-детект SRC: сначала okopf_data/web, затем web (fallback).
          SRC=""
          for cand in ./output/okopf_data/web ./output/web; do
            if [ -f "$cand/okopf.json" ]; then
              SRC="$cand"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "::error::Ни в ./output/okopf_data/web, ни в ./output/web нет okopf.json"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Detected SRC=$SRC"

          MISSING=0
          for f in okopf.json okopf.json.gz okopf_meta.json okopf_meta.json.gz; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "./$f"
              echo "copied $f"
            else
              echo "::warning::MISSING $f в $SRC"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Отсутствует $MISSING из 4 файлов — коммит пропущен, сайт остаётся на последней хорошей версии"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "✅ Все 4 файла на месте"
            echo "FILES_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Check metadata (META_OK gate)
        if: env.FILES_OK == 'true'
        run: |
          if [ ! -f okopf_meta.json ]; then
            echo "::error::okopf_meta.json отсутствует"
            echo "META_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'EOF'
          import json, hashlib, os

          with open("okopf_meta.json", encoding="utf-8") as f:
              m = json.load(f)

          with open("okopf.json", "rb") as f:
              raw = f.read()

          expected_full = hashlib.sha256(raw).hexdigest()

          problems = []
          if not m.get("publish_allowed"):
              problems.append(f"publish_allowed={m.get('publish_allowed')!r}")
          ce = m.get("critical_errors") or []
          if ce:
              problems.append(f"critical_errors={ce}")
          if m.get("data_hash_full") != expected_full:
              problems.append(
                  f"data_hash_full mismatch: meta={m.get('data_hash_full')!r} actual={expected_full!r}"
              )
          if m.get("data_hash") != expected_full[:16]:
              problems.append(
                  f"data_hash mismatch: meta={m.get('data_hash')!r} expected={expected_full[:16]!r}"
              )

          env_file = os.environ["GITHUB_ENV"]
          if problems:
              print("::error::META gate FAILED")
              for p in problems:
                  print(f"  - {p}")
              with open(env_file, "a") as f:
                  f.write("META_OK=false\n")
          else:
              print("META_OK=true (publish_allowed + data_hash совпадают)")
              with open(env_file, "a") as f:
                  f.write("META_OK=true\n")
          EOF

      - name: Commit and push changes
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add okopf.json okopf.json.gz okopf_meta.json okopf_meta.json.gz
          if git diff --cached --quiet; then
            echo "Изменений нет — данные уже актуальны"
          else
            SOURCE_DATE=$(python -c "import json;m=json.load(open('okopf_meta.json'));print(m.get('source_date') or m.get('effective_date') or m.get('prepared_date') or m.get('generated_at') or '?')")
            git commit -m "Auto-update: OKOPF data from kernel output (source $SOURCE_DATE) [skip ci]"
            git push
            echo "Изменения запушены"
          fi

      - name: Trigger new notebook run (fire-and-forget, всегда)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/okopf-classifier-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"